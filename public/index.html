<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Server Browser</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --chakra-colors-gray-50: #F7FAFC;
            --chakra-colors-gray-100: #EDF2F7;
            --chakra-colors-gray-200: #E2E8F0;
            --chakra-colors-gray-300: #CBD5E0;
            --chakra-colors-gray-400: #A0AEC0;
            --chakra-colors-gray-500: #718096;
            --chakra-colors-gray-600: #4A5568;
            --chakra-colors-gray-700: #2D3748;
            --chakra-colors-gray-800: #1A202C;
            --chakra-colors-blue-500: #3182CE;
            --chakra-font-family-sans: 'Inter', sans-serif;
            --chakra-font-family-data: 'DM Sans', 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--chakra-font-family-sans);
            background-color: var(--chakra-colors-gray-50);
            color: var(--chakra-colors-gray-800);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--chakra-colors-gray-800);
        }

        .server-info {
            background: white;
            border: 1px solid var(--chakra-colors-gray-200);
            border-radius: 8px;
            padding: 24px;
        }

        .server-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--chakra-colors-gray-200);
            padding-bottom: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-item {
            font-size: 0.875rem;
        }

        .info-item label {
            font-weight: 600;
            color: var(--chakra-colors-gray-600);
            display: block;
            margin-bottom: 4px;
        }

        .info-item .value {
            font-family: var(--chakra-font-family-data);
            font-size: 0.875rem;
            color: var(--chakra-colors-gray-700);
            word-break: break-all;
        }

        .ip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .ip-item {
            background-color: var(--chakra-colors-gray-100);
            padding: 4px 12px;
            border-radius: 9999px;
            font-family: var(--chakra-font-family-data);
            font-size: 0.875rem;
            color: var(--chakra-colors-gray-700);
        }

        .content {
            background: white;
            border: 1px solid var(--chakra-colors-gray-200);
            border-radius: 8px;
            overflow: hidden;
        }

        .view-tabs {
            display: flex;
            gap: 8px;
            padding: 0 24px;
            border-bottom: 1px solid var(--chakra-colors-gray-200);
            background: white;
        }

        .view-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 12px 12px;
            color: var(--chakra-colors-gray-500);
            background: transparent;
            border: 0;
            border-bottom: 2px solid transparent;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .view-tab.active {
            color: var(--chakra-colors-blue-500);
            border-bottom-color: var(--chakra-colors-blue-500);
        }

        .tracker-view { display: none; padding: 24px; }
        .tracker-view.active { display: block; }
        .tracker-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
        .tracker-card, .tracker-table-card {
            background: white;
            border: 1px solid var(--chakra-colors-gray-200);
            border-radius: 8px;
        }
        .tracker-card { padding: 16px 20px; }
        .tracker-card-label { color: var(--chakra-colors-gray-500); font-size: 0.85rem; }
        .tracker-card-value { color: var(--chakra-colors-gray-800); font-size: 1.5rem; font-weight: 600; margin-top: 4px; }
        .tracker-table-card { overflow: hidden; margin-bottom: 20px; }
        .tracker-section-heading { padding: 16px 20px; font-size: 1rem; font-weight: 600; border-bottom: 1px solid var(--chakra-colors-gray-200); }
        .tracker-table-wrap { overflow-x: auto; }
        .tracker-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.82rem; }
        .tracker-table th, .tracker-table td { padding: 12px 14px; border-bottom: 1px solid var(--chakra-colors-gray-100); white-space: nowrap; }
        .tracker-table th { color: var(--chakra-colors-gray-600); background: var(--chakra-colors-gray-50); font-weight: 600; }
        .tracker-table tr.download-row.striped > td { background: var(--chakra-colors-gray-100); }
        .tracker-table tr:last-child td { border-bottom: 0; }
        .tracker-file-name { font-weight: 600; color: var(--chakra-colors-gray-800); }
        .tracker-file-path, .tracker-peer-details { display: block; color: var(--chakra-colors-gray-500); font-size: 0.75rem; margin-top: 3px; }
        .tracker-empty { color: var(--chakra-colors-gray-500); text-align: center; padding: 32px !important; }
        .peer-graph-cell { padding: 8px 14px 16px !important; background: white; }
        .peer-graph-cell.striped { background: var(--chakra-colors-gray-100) !important; }
        .peer-graph-panel { overflow: hidden; background: white; }
        .peer-graph-cell.striped .peer-graph-panel,
        .peer-graph-cell.striped .peer-speed-canvas { background: var(--chakra-colors-gray-100); }
        .peer-graph-heading { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; color: #527057; font-size: 0.75rem; }
        .peer-graph-speed { color: #16842b; font-weight: 600; }
        .peer-speed-canvas { display: block; width: 100%; height: 104px; }

        @media (max-width: 768px) {
            .tracker-summary { grid-template-columns: 1fr; gap: 10px; }
            .tracker-view { padding: 16px; }
        }

        .breadcrumb {
            padding: 16px 24px;
            font-family: var(--chakra-font-family-data);
            font-size: 0.875rem;
            color: var(--chakra-colors-gray-600);
            border-bottom: 1px solid var(--chakra-colors-gray-200);
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--chakra-colors-gray-100);
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: var(--chakra-colors-gray-50);
        }

        .file-icon {
            margin-right: 16px;
            width: 24px;
            height: 24px;
            color: var(--chakra-colors-gray-500);
        }

        .folder {
            color: var(--chakra-colors-blue-500);
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: var(--chakra-colors-gray-800);
        }

        .file-meta {
            color: var(--chakra-colors-gray-500);
            font-size: 0.875rem;
            margin-top: 2px;
        }

        .file-size {
            color: var(--chakra-colors-gray-600);
            font-size: 0.875rem;
            font-family: var(--chakra-font-family-data);
        }

        .peer-list {
            display: none;
            list-style: none;
            padding: 0 24px 12px 64px;
            border-bottom: 1px solid var(--chakra-colors-gray-100);
        }

        .peer-list.visible { display: block; }

        .peer-row, .peer-heading {
            display: grid;
            grid-template-columns: minmax(120px, 1.4fr) repeat(6, minmax(75px, 1fr));
            gap: 12px;
            align-items: center;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .peer-heading {
            background: var(--chakra-colors-gray-500);
            color: white;
            font-weight: 600;
            border-radius: 4px;
        }

        .peer-row { color: var(--chakra-colors-gray-600); border-bottom: 1px solid var(--chakra-colors-gray-100); }
        .peer-row span { overflow-wrap: anywhere; }
        .peer-ip { color: var(--chakra-colors-gray-800); font-weight: 600; }
        .peer-eta { color: #2F855A; font-weight: 600; }
        .peer-identity { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
        .peer-details { color: var(--chakra-colors-gray-500); font-size: 0.72rem; }

        @media (max-width: 600px) {
            .peer-list { padding-left: 12px; padding-right: 12px; overflow-x: auto; }
            .peer-heading, .peer-row { min-width: 720px; }
        }

        .loading,
        .error {
            padding: 40px;
            text-align: center;
            color: var(--chakra-colors-gray-500);
        }

        .error-message {
            background: #FED7D7;
            color: #C53030;
            border: 1px solid #FBB6B6;
            border-radius: 8px;
            padding: 16px;
        }

        .spinner {
            border: 3px solid var(--chakra-colors-gray-200);
            border-top: 3px solid var(--chakra-colors-blue-500);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Chat Styles */
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: white;
            border: 1px solid var(--chakra-colors-gray-200);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transform: translateY(calc(100% + 20px));
            transition: transform 0.3s ease;
        }

        .chat-container.open {
            transform: translateY(0);
        }

        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--chakra-colors-blue-500);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .chat-toggle:hover {
            background: #2C5282;
            transform: scale(1.1);
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--chakra-colors-gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--chakra-colors-gray-50);
            border-radius: 12px 12px 0 0;
        }

        .chat-title {
            font-weight: 600;
            color: var(--chakra-colors-gray-800);
        }

        .chat-users {
            font-size: 0.75rem;
            color: var(--chakra-colors-gray-500);
        }

        .chat-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--chakra-colors-gray-500);
            padding: 4px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .chat-message.own {
            align-self: flex-end;
            background: var(--chakra-colors-blue-500);
            color: white;
        }

        .chat-message.other {
            align-self: flex-start;
            background: var(--chakra-colors-gray-100);
            color: var(--chakra-colors-gray-800);
        }

        .chat-message .username {
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .chat-message .timestamp {
            font-size: 0.625rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        .system-message {
            align-self: center;
            background: var(--chakra-colors-gray-50);
            color: var(--chakra-colors-gray-600);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            font-style: italic;
        }

        .chat-input-container {
            padding: 16px;
            border-top: 1px solid var(--chakra-colors-gray-200);
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--chakra-colors-gray-300);
            border-radius: 20px;
            font-size: 0.875rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--chakra-colors-blue-500);
        }

        .chat-send {
            padding: 8px 16px;
            background: var(--chakra-colors-blue-500);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .chat-send:hover {
            background: #2C5282;
        }

        .chat-send:disabled {
            background: var(--chakra-colors-gray-300);
            cursor: not-allowed;
        }

        .username-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .username-modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
        }

        .username-modal h3 {
            margin-bottom: 16px;
            color: var(--chakra-colors-gray-800);
        }

        .username-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--chakra-colors-gray-300);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.875rem;
        }

        .username-button {
            background: var(--chakra-colors-blue-500);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .chat-container {
                width: calc(100vw - 40px);
                height: 400px;
                right: 20px;
                left: 20px;
            }

            .chat-toggle {
                right: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>File Server Browser</h1>
            <div class="server-info" id="serverInfo">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading server information...</p>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="view-tabs" role="tablist" aria-label="File server views">
                <button type="button" class="view-tab active" id="filesTab" role="tab" aria-selected="true" onclick="fileServer.showView('files')"><i class="bi bi-folder2-open" aria-hidden="true"></i>Files</button>
                <button type="button" class="view-tab" id="trackerTab" role="tab" aria-selected="false" onclick="fileServer.showView('tracker')" hidden><i class="bi bi-activity" aria-hidden="true"></i>Tracker</button>
            </div>
            <div id="filesView">
                <div class="breadcrumb" id="breadcrumb">/</div>
                <div id="fileList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading files...</p>
                    </div>
                </div>
            </div>
            <section class="tracker-view" id="trackerView" role="tabpanel" aria-labelledby="trackerTab">
                <div class="tracker-summary">
                    <div class="tracker-card"><div class="tracker-card-label">Active downloads</div><div class="tracker-card-value" id="trackerActiveCount">0</div></div>
                    <div class="tracker-card"><div class="tracker-card-label">Current throughput</div><div class="tracker-card-value" id="trackerTotalSpeed">0 B/s</div></div>
                    <div class="tracker-card"><div class="tracker-card-label">Downloaded by active peers</div><div class="tracker-card-value" id="trackerDownloaded">0 MB</div></div>
                </div>
                <div class="tracker-table-card">
                    <div class="tracker-section-heading">Active downloads</div>
                    <div class="tracker-table-wrap">
                        <table class="tracker-table">
                            <thead><tr><th>File</th><th>Peer</th><th>Progress</th><th>Downloaded</th><th>Left</th><th>Speed</th><th>ETA</th><th>Elapsed</th></tr></thead>
                            <tbody id="trackerDownloadRows"><tr><td class="tracker-empty" colspan="8">No active downloads</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Chat Toggle Button -->
    <button class="chat-toggle" id="chatToggle" onclick="toggleChat()" aria-label="Open live chat" title="Open live chat"><i class="bi bi-chat-dots" aria-hidden="true"></i></button>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <div>
                <div class="chat-title">Live Chat</div>
                <div class="chat-users" id="chatUsers">0 users online</div>
            </div>
            <button class="chat-close" onclick="toggleChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." maxlength="500">
            <button class="chat-send" id="chatSend" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Username Modal -->
    <div class="username-modal" id="usernameModal" style="display: none;">
        <div class="username-modal-content">
            <h3>Enter your name</h3>
            <input type="text" class="username-input" id="usernameInput" placeholder="Your name" maxlength="20">
            <button class="username-button" onclick="joinChat()">Join Chat</button>
        </div>
    </div>

    <script>
        class FileServer {
            constructor() {
                this.currentPath = '';
                this.serverInfo = null;
                this.downloadPeers = new Map();
                this.trackerSnapshot = { downloads: [], totalSpeed: 0 };
                socket = io();
                this.socket = socket;
                this.socket.on('connect', () => {
                    this.socket.emit('peer-info', { deviceName: this.getDeviceName() });
                });
                this.socket.on('download-peers', ({ filePath, peers }) => {
                    this.downloadPeers.set(filePath, peers);
                    this.renderPeers(filePath);
                });
                this.socket.on('tracker-access', allowed => {
                    const trackerTab = document.getElementById('trackerTab');
                    trackerTab.hidden = !allowed;
                });
                this.socket.on('tracker-update', snapshot => {
                    this.trackerSnapshot = snapshot;
                    this.renderTracker(snapshot);
                });
                initializeChat();
                this.folderIcon = '<i class="file-icon folder bi bi-folder" aria-hidden="true"></i>';
                this.fileIcon = '<i class="file-icon bi bi-file-earmark" aria-hidden="true"></i>';
                this.init();
            }

            async init() {
                await this.loadServerInfo();
                await this.loadDirectory(this.currentPath);
            }

            async loadServerInfo() {
                const serverInfoEl = document.getElementById('serverInfo');
                try {
                    const response = await fetch('/api/server-info');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    this.serverInfo = await response.json();
                    this.renderServerInfo();
                } catch (error) {
                    console.error('Failed to load server info:', error);
                    serverInfoEl.innerHTML = `<div class="error-message"><strong>Error:</strong> Could not load server information. Is the server running?</div>`;
                }
            }

            renderServerInfo() {
                const serverInfoEl = document.getElementById('serverInfo');
                const info = this.serverInfo;

                let networkIPsHtml = info.networkIPs.map(ip =>
                    `<div class="ip-item">${ip.address}:${info.port}</div>`
                ).join('') || `<div class="ip-item">No network IPs found</div>`;

                serverInfoEl.innerHTML = `
                    <h3>Server Information</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <label>Hostname</label>
                            <div class="value">${info.hostname}</div>
                        </div>
                        <div class="info-item">
                            <label>Port</label>
                            <div class="value">${info.port}</div>
                        </div>
                        <div class="info-item">
                            <label>Serving Directory</label>
                            <div class="value">${info.serveDir}</div>
                        </div>
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <label>Local Network URLs</label>
                            <div class="ip-list">${networkIPsHtml}</div>
                        </div>
                        ${info.externalIP ? `
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <label>External IP (for cross-network access)</label>
                            <div class="value" style="color: #E53E3E; font-weight: 600;">${info.externalIP}:${info.port}</div>
                            <div style="font-size: 0.75rem; color: #718096; margin-top: 4px;">
                                <i class="bi bi-exclamation-triangle" aria-hidden="true" style="margin-right: 4px;"></i>Requires router port forwarding setup
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }

            async loadDirectory(path) {
                const fileListEl = document.getElementById('fileList');
                fileListEl.innerHTML = `<div class="loading"><div class="spinner"></div><p>Loading files...</p></div>`;
                try {
                    const response = await fetch(`/api/browse/${path}`);
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || `HTTP ${response.status}: ${response.statusText}`);
                    }
                    const data = await response.json();
                    this.renderDirectory(data);
                    this.updateBreadcrumb(data.path);
                } catch (error) {
                    this.renderError(`Failed to load directory: ${error.message}`);
                }
            }

            renderDirectory(data) {
                const fileListEl = document.getElementById('fileList');
                let html = '<ul class="file-list">';

                if (data.parent !== null && data.parent !== undefined) {
                    html += `
                        <li class="file-item" onclick="fileServer.navigateToDirectory('${data.parent}')">
                            ${this.folderIcon}
                            <div class="file-info">
                                <div class="file-name">..</div>
                            </div>
                        </li>
                    `;
                }

                if (!data.files || data.files.length === 0) {
                    html += `<li class="file-item" style="cursor: default;"><div class="file-info"><div class="file-meta">This directory is empty.</div></div></li>`
                } else {
                    const sortedFiles = data.files.sort((a, b) => {
                        if (a.isDirectory && !b.isDirectory) return -1;
                        if (!a.isDirectory && b.isDirectory) return 1;
                        return a.name.localeCompare(b.name);
                    });

                    sortedFiles.forEach(file => {
                        const icon = file.isDirectory ? this.folderIcon : this.fileIcon;
                        const onClick = file.isDirectory ?
                            `fileServer.navigateToDirectory('${this.joinPath(data.path, file.name)}')` :
                            `fileServer.downloadFile('${this.joinPath(data.path, file.name)}')`;

                        const sizeInfo = !file.isDirectory ? `<div class="file-size">${(file.size / 1024).toFixed(1)} KB</div>` : '';
                        const modifiedDate = new Date(file.modified).toLocaleDateString();

                        html += `
                            <li class="file-item" onclick="${onClick}">
                                ${icon}
                                <div class="file-info">
                                    <div class="file-name">${file.name}</div>
                                    <div class="file-meta">Modified: ${modifiedDate}</div>
                                </div>
                                ${sizeInfo}
                            </li>
                        `;
                        if (!file.isDirectory) {
                            const filePath = this.joinPath(data.path, file.name);
                            html += `<li class="peer-list" data-peer-path="${this.escapeAttribute(filePath)}"></li>`;
                        }
                    });
                }

                html += '</ul>';
                fileListEl.innerHTML = html;
                this.downloadPeers.forEach((_, filePath) => this.renderPeers(filePath));
            }

            renderError(message) {
                document.getElementById('fileList').innerHTML = `<div class="error"><div class="error-message"><strong>Error:</strong> ${message}</div></div>`;
            }

            updateBreadcrumb(path) {
                document.getElementById('breadcrumb').textContent = `/${path}`;
            }

            showView(view) {
                const showTracker = view === 'tracker' && !document.getElementById('trackerTab').hidden;
                document.getElementById('filesView').style.display = showTracker ? 'none' : 'block';
                document.getElementById('trackerView').classList.toggle('active', showTracker);
                document.getElementById('filesTab').classList.toggle('active', !showTracker);
                document.getElementById('trackerTab').classList.toggle('active', showTracker);
                document.getElementById('filesTab').setAttribute('aria-selected', String(!showTracker));
                document.getElementById('trackerTab').setAttribute('aria-selected', String(showTracker));
                if (showTracker) this.renderTracker(this.trackerSnapshot);
            }

            renderTracker(snapshot) {
                const downloads = snapshot.downloads || [];
                document.getElementById('trackerActiveCount').textContent = downloads.length;
                document.getElementById('trackerTotalSpeed').textContent = `${this.formatBytes(snapshot.totalSpeed)}/s`;
                document.getElementById('trackerDownloaded').textContent = `${this.formatMegabytes(downloads.reduce((total, download) => total + download.downloaded, 0))} MB`;

                const tbody = document.getElementById('trackerDownloadRows');
                tbody.replaceChildren();
                if (!downloads.length) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.className = 'tracker-empty';
                    cell.colSpan = 8;
                    cell.textContent = 'No active downloads';
                    row.appendChild(cell);
                    tbody.appendChild(row);
                } else {
                    const peerGraphs = [];
                    downloads.forEach((download, index) => {
                        const row = document.createElement('tr');
                        row.className = index % 2 ? 'download-row striped' : 'download-row';
                        const file = document.createElement('td');
                        const fileName = document.createElement('span');
                        fileName.className = 'tracker-file-name';
                        fileName.textContent = download.fileName;
                        const filePath = document.createElement('span');
                        filePath.className = 'tracker-file-path';
                        filePath.textContent = download.filePath;
                        file.append(fileName, filePath);

                        const peer = document.createElement('td');
                        peer.textContent = download.ip;
                        const peerDetails = document.createElement('span');
                        peerDetails.className = 'tracker-peer-details';
                        peerDetails.textContent = [download.deviceName, download.nickname].filter(Boolean).join(' · ');
                        peer.appendChild(peerDetails);

                        [file, peer, `${download.percent.toFixed(1)}%`, `${this.formatMegabytes(download.downloaded)} MB`, `${this.formatMegabytes(download.left)} MB`, `${this.formatBytes(download.speed)}/s`, this.formatDuration(download.eta), this.formatDuration(download.elapsed)].forEach(value => {
                            const cell = typeof value === 'string' ? document.createElement('td') : value;
                            if (typeof value === 'string') cell.textContent = value;
                            row.appendChild(cell);
                        });
                        tbody.appendChild(row);

                        const graphRow = document.createElement('tr');
                        const graphCell = document.createElement('td');
                        graphCell.className = index % 2 ? 'peer-graph-cell striped' : 'peer-graph-cell';
                        graphCell.colSpan = 8;
                        const graphPanel = document.createElement('div');
                        graphPanel.className = 'peer-graph-panel';
                        const graphHeading = document.createElement('div');
                        graphHeading.className = 'peer-graph-heading';
                        const graphTitle = document.createElement('span');
                        graphTitle.textContent = 'Download Speed';
                        const graphSpeed = document.createElement('span');
                        graphSpeed.className = 'peer-graph-speed';
                        graphSpeed.textContent = `${this.formatBytes(download.speed)}/s`;
                        graphHeading.append(graphTitle, graphSpeed);
                        const graphCanvas = document.createElement('canvas');
                        graphCanvas.className = 'peer-speed-canvas';
                        graphCanvas.setAttribute('role', 'img');
                        graphCanvas.setAttribute('aria-label', `Download speed for ${download.ip} over the last 60 seconds`);
                        graphPanel.append(graphHeading, graphCanvas);
                        graphCell.appendChild(graphPanel);
                        graphRow.appendChild(graphCell);
                        tbody.appendChild(graphRow);
                        peerGraphs.push({ canvas: graphCanvas, history: download.speedHistory || [] });
                    });
                    peerGraphs.forEach(graph => this.drawPeerSpeedChart(graph.canvas, graph.history));
                }
            }

            drawPeerSpeedChart(canvas, points) {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                if (!width || !height) return;
                const ratio = window.devicePixelRatio || 1;
                canvas.width = width * ratio;
                canvas.height = height * ratio;
                const context = canvas.getContext('2d');
                context.setTransform(ratio, 0, 0, ratio, 0, 0);
                context.clearRect(0, 0, width, height);

                const padding = { left: 8, right: 8, top: 6, bottom: 6 };
                const plotWidth = width - padding.left - padding.right;
                const plotHeight = height - padding.top - padding.bottom;
                const maxSpeed = Math.max(1024, ...points.map(point => point.speed)) * 1.12;
                const chartBackground = canvas.closest('.peer-graph-cell')?.classList.contains('striped') ? '#EDF2F7' : '#ffffff';
                context.fillStyle = chartBackground;
                context.fillRect(0, 0, width, height);
                context.strokeStyle = 'rgba(42, 160, 55, 0.14)';
                context.lineWidth = 1;
                for (let index = 0; index <= 4; index++) {
                    const y = padding.top + index / 4 * plotHeight;
                    context.beginPath();
                    context.moveTo(padding.left, y);
                    context.lineTo(width - padding.right, y);
                    context.stroke();
                }
                for (let index = 0; index <= 20; index++) {
                    const x = padding.left + index / 20 * plotWidth;
                    context.beginPath();
                    context.moveTo(x, padding.top);
                    context.lineTo(x, height - padding.bottom);
                    context.stroke();
                }
                if (!points.length) return;

                const lastTime = points[points.length - 1].time;
                const coordinates = points.map(point => ({
                    x: padding.left + Math.max(0, plotWidth - ((lastTime - point.time) / 60000) * plotWidth),
                    y: padding.top + plotHeight * (1 - point.speed / maxSpeed)
                }));
                const gradient = context.createLinearGradient(0, padding.top, 0, height - padding.bottom);
                gradient.addColorStop(0, 'rgba(18, 177, 48, 0.78)');
                gradient.addColorStop(1, 'rgba(18, 177, 48, 0.58)');
                context.beginPath();
                context.moveTo(coordinates[0].x, height - padding.bottom);
                coordinates.forEach(point => context.lineTo(point.x, point.y));
                context.lineTo(coordinates[coordinates.length - 1].x, height - padding.bottom);
                context.closePath();
                context.fillStyle = gradient;
                context.fill();
                context.beginPath();
                coordinates.forEach((point, index) => index ? context.lineTo(point.x, point.y) : context.moveTo(point.x, point.y));
                context.strokeStyle = '#0c9c2c';
                context.lineWidth = 1.8;
                context.lineJoin = 'round';
                context.lineCap = 'round';
                context.stroke();
            }

            navigateToDirectory(path) {
                this.currentPath = path;
                this.loadDirectory(path);
            }

            downloadFile(path) {
                window.open(`/download/${encodeURI(path)}?peerId=${encodeURIComponent(this.socket.id || '')}`, '_blank');
            }

            renderPeers(filePath) {
                const container = Array.from(document.querySelectorAll('.peer-list')).find(el => el.dataset.peerPath === filePath);
                if (!container) return;
                const peers = this.downloadPeers.get(filePath) || [];
                container.replaceChildren();
                container.classList.toggle('visible', peers.length > 0);
                if (!peers.length) return;

                const heading = document.createElement('div');
                heading.className = 'peer-heading';
                ['IP', '%', 'Downloaded', 'Left', 'Speed', 'ETA', 'Elapsed'].forEach(label => {
                    const cell = document.createElement('span');
                    cell.textContent = label;
                    heading.appendChild(cell);
                });
                container.appendChild(heading);
                peers.forEach(peer => {
                    const row = document.createElement('div');
                    row.className = 'peer-row';
                    const identity = document.createElement('div');
                    identity.className = 'peer-identity';
                    const ip = document.createElement('span');
                    ip.className = 'peer-ip';
                    ip.textContent = peer.ip;
                    const details = document.createElement('span');
                    details.className = 'peer-details';
                    details.textContent = [peer.deviceName, peer.nickname].filter(Boolean).join(' · ');
                    identity.append(ip, details);
                    row.appendChild(identity);
                    [`${peer.percent.toFixed(1)}%`, `${this.formatMegabytes(peer.downloaded)} MB`, `${this.formatMegabytes(peer.left)} MB`, `${this.formatBytes(peer.speed)}/s`, this.formatDuration(peer.eta), this.formatDuration(peer.elapsed)].forEach((value, index) => {
                        const cell = document.createElement('span');
                        cell.textContent = value;
                        if (index === 4) cell.className = 'peer-eta';
                        row.appendChild(cell);
                    });
                    container.appendChild(row);
                });
            }

            formatBytes(bytes) {
                if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB'];
                const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
                return `${(bytes / Math.pow(1024, index)).toFixed(1)} ${units[index]}`;
            }

            formatMegabytes(bytes) {
                return (Math.max(0, bytes || 0) / (1024 * 1024)).toFixed(1);
            }

            formatDuration(seconds) {
                if (!Number.isFinite(seconds)) return '—';
                const value = Math.max(0, Math.floor(seconds));
                const hours = Math.floor(value / 3600);
                const minutes = Math.floor((value % 3600) / 60);
                const secs = value % 60;
                return hours ? `${hours}h ${minutes}m` : minutes ? `${minutes}m ${secs}s` : `${secs}s`;
            }

            escapeAttribute(value) {
                return value.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            getDeviceName() {
                const ua = navigator.userAgent;
                const platform = /iPhone|iPad|iPod/.test(ua) ? 'iOS'
                    : /Android/.test(ua) ? 'Android'
                    : /Windows/.test(ua) ? 'Windows'
                    : /Mac OS X/.test(ua) ? 'macOS'
                    : /CrOS/.test(ua) ? 'ChromeOS'
                    : /Linux/.test(ua) ? 'Linux' : 'Unknown device';
                const browser = /Edg\//.test(ua) ? 'Edge'
                    : /Firefox\//.test(ua) ? 'Firefox'
                    : /Chrome\//.test(ua) ? 'Chrome'
                    : /Safari\//.test(ua) ? 'Safari' : 'Browser';
                return `${platform} · ${browser}`;
            }

            joinPath(dir, file) {
                return dir ? `${dir}/${file}` : file;
            }
        }

        // Chat functionality
        let socket;
        let currentUsername = '';
        let currentDisplayName = '';
        let isChatOpen = false;
        let isConnected = false;
        let chatInitialized = false;

        function initializeChat() {
            if (chatInitialized) return;
            chatInitialized = true;
            socket.on('connect', () => {
                console.log('Connected to chat server');
                isConnected = true;
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from chat server');
                isConnected = false;
                updateChatUsers(0);
            });

            socket.on('username-assigned', (secureUsername) => {
                currentUsername = secureUsername;
                addSystemMessage(`Your secure username: ${secureUsername}`);
            });

            socket.on('user-joined', (data) => {
                addSystemMessage(`${data.user.username} (${data.user.displayName}) joined the chat`);
                updateChatUsers(data.totalUsers);
            });

            socket.on('user-left', (data) => {
                addSystemMessage(`${data.user.username} left the chat`);
                updateChatUsers(data.totalUsers);
            });

            socket.on('chat-message', (message) => {
                addChatMessage(message);
            });

            socket.on('users-list', (users) => {
                updateChatUsers(users.length);
            });
        }

        function toggleChat() {
            const chatContainer = document.getElementById('chatContainer');
            const chatToggle = document.getElementById('chatToggle');
            
            isChatOpen = !isChatOpen;
            
            if (isChatOpen) {
                chatContainer.classList.add('open');
                chatToggle.style.display = 'none';
                
                if (!currentUsername) {
                    showUsernameModal();
                }
            } else {
                chatContainer.classList.remove('open');
                chatToggle.style.display = 'flex';
            }
        }

        function showUsernameModal() {
            document.getElementById('usernameModal').style.display = 'flex';
            document.getElementById('usernameInput').focus();
        }

        function joinChat() {
            const usernameInput = document.getElementById('usernameInput');
            const displayName = usernameInput.value.trim();
            
            if (displayName) {
                currentDisplayName = displayName;
                document.getElementById('usernameModal').style.display = 'none';
                
                initializeChat();
                
                socket.emit('join-chat', displayName);
                addSystemMessage(`Welcome to the chat, ${displayName}!`);
            }
        }

        function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            
            if (message && isConnected) {
                socket.emit('chat-message', { message });
                chatInput.value = '';
            }
        }

        function addChatMessage(message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            
            const isOwnMessage = message.username === currentUsername;
            messageEl.className = `chat-message ${isOwnMessage ? 'own' : 'other'}`;
            
            const timestamp = new Date(message.timestamp).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageEl.innerHTML = `
                ${!isOwnMessage ? `<div class="username">${message.username}</div>` : ''}
                <div>${escapeHtml(message.message)}</div>
                <div class="timestamp">${timestamp}</div>
            `;
            
            chatMessages.appendChild(messageEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = 'system-message';
            messageEl.textContent = text;
            
            chatMessages.appendChild(messageEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateChatUsers(count) {
            document.getElementById('chatUsers').textContent = `${count} user${count !== 1 ? 's' : ''} online`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Enter key support for username input
            document.getElementById('usernameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    joinChat();
                }
            });

            // Enter key support for chat input
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });

        let fileServer;
        document.addEventListener('DOMContentLoaded', () => {
            fileServer = new FileServer();
        });
    </script>
</body>
